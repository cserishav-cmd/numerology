[project]
name = "chaldean-numerology"
version = "1.0.0"
description = "Chaldean Numerology Name Suggestion Tool"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = [
    ".",
    ".venv/Lib/site-packages",
    "d:/Projects/new/.venv/Lib/site-packages"
]

[tool.pytest.ini_options]
pythonpath = [
    ".",
    "app"
]
testpaths = ["tests"]
